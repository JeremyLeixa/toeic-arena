<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>TOEIC Arena Intro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Outfit";
        src: url("fonts/outfit-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      :root {
        --bg: #07060d;
        --neon: #00f0ff;
        --neon2: #ff2bd6;
        --ink: #f4f7ff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        font-family: "Outfit", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 55%, #14102a 0%, var(--bg) 62%);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* perspective neon grid */
      #grid-wrap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 520px;
        overflow: hidden;
        perspective: 600px;
      }
      #grid {
        position: absolute;
        left: -50%;
        width: 200%;
        height: 200%;
        bottom: -60%;
        transform-origin: 50% 100%;
        transform: rotateX(64deg);
        background-image:
          linear-gradient(to right, rgba(0, 240, 255, 0.55) 2px, transparent 2px),
          linear-gradient(to bottom, rgba(0, 240, 255, 0.55) 2px, transparent 2px);
        background-size: 120px 120px;
        -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 80%);
        mask-image: linear-gradient(to top, #000 10%, transparent 80%);
      }
      #horizon {
        position: absolute;
        left: 0;
        right: 0;
        top: 560px;
        height: 3px;
        background: var(--neon);
        box-shadow: 0 0 24px 6px var(--neon), 0 0 80px 18px rgba(0, 240, 255, 0.45);
        transform-origin: 50% 50%;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding-bottom: 120px;
      }
      .word {
        display: flex;
        gap: 0;
        line-height: 1;
        font-weight: 900;
        text-transform: uppercase;
        white-space: nowrap;
      }
      #w-toeic {
        font-size: 250px;
        letter-spacing: 0.02em;
        color: var(--ink);
      }
      #w-arena {
        font-size: 250px;
        letter-spacing: 0.06em;
        color: #b8fbff;
        text-shadow: 0 0 18px var(--neon), 0 0 60px rgba(0, 240, 255, 0.65);
      }
      .ch {
        display: inline-block;
      }
      #tag {
        margin-top: 34px;
        font-size: 46px;
        font-weight: 500;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #b9c2ff;
      }
      #tag b {
        color: var(--neon2);
        font-weight: 700;
        text-shadow: 0 0 22px rgba(255, 43, 214, 0.8);
      }
      #flash {
        background: #fff;
        opacity: 0;
      }
      #root::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 5;
        background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.7) 100%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-199x" id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div data-hf-id="hf-pf0e" id="bg" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div data-hf-id="hf-b8v6" id="grid-wrap"><div data-hf-id="hf-sleo" id="grid" data-layout-allow-overflow=""></div></div>
        <div data-hf-id="hf-b22m" id="horizon"></div>
      </div>

      <div data-hf-id="hf-zzik" id="stage" class="clip" data-start="0" data-duration="10" data-track-index="1">
        <div data-hf-id="hf-2g3u" id="w-toeic" class="word"></div>
        <div data-hf-id="hf-ez8j" id="w-arena" class="word"></div>
        <div data-hf-id="hf-ir76" id="tag">Train <b data-hf-id="hf-x3pa">/</b> Duel <b data-hf-id="hf-q6zm">/</b> Level up</div>
      </div>

      <div data-hf-id="hf-ex85" id="flash" class="clip" data-start="0" data-duration="10" data-track-index="2"></div>
    </div>

    <script>
      // Split words into letters (static DOM, deterministic)
      function split(id, text) {
        const el = document.getElementById(id);
        text.split("").forEach((c) => {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c;
          el.appendChild(s);
        });
        return el.querySelectorAll(".ch");
      }
      const toeic = split("w-toeic", "TOEIC");
      const arena = split("w-arena", "ARENA");

      const tl = gsap.timeline({ paused: true });

      // 0.0-1.4  horizon ignites, grid rises
      tl.fromTo("#horizon", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.9, ease: "power3.out" }, 0.1);
      tl.fromTo("#grid-wrap", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.3);
      tl.fromTo("#grid", { backgroundPosition: "0px 0px" }, { backgroundPosition: "0px 1200px", duration: 10, ease: "none" }, 0);

      // 1.2-2.6  TOEIC slams in letter by letter
      tl.fromTo(
        toeic,
        { opacity: 0, y: -160, scale: 1.6, rotationZ: -6 },
        { opacity: 1, y: 0, scale: 1, rotationZ: 0, duration: 0.55, ease: "back.out(2.4)", stagger: 0.11 },
        1.2
      );

      // 2.6  impact flash + shake
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.35, duration: 0.06, ease: "power1.out" }, 2.55);
      tl.to("#flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, 2.61);
      tl.to("#w-toeic", { x: 10, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, 2.55);

      // 3.0-4.4  ARENA ignites in neon, letters rise
      tl.fromTo(
        arena,
        { opacity: 0, y: 90, filter: "blur(18px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out", stagger: 0.09 },
        3.0
      );
      // neon flicker on ARENA
      tl.to("#w-arena", { opacity: 0.55, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, 4.15);
      tl.set("#w-arena", { opacity: 1 }, 4.5);

      // 5.0-6.0 tagline
      tl.fromTo("#tag", { opacity: 0, y: 30, scale: 1.12 }, { opacity: 1, y: 0, scale: 1, duration: 1.0, ease: "power3.out" }, 5.0);

      // 6.5-9.0 neon pulse on ARENA + slow push-in
      tl.to("#w-arena", { textShadow: "0 0 26px #00f0ff, 0 0 90px rgba(0,240,255,0.55)", duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, 6.6);
      tl.fromTo("#stage", { scale: 1 }, { scale: 1.06, duration: 9, ease: "none" }, 1);

      // 9.1-10 fade out
      tl.to("#stage", { opacity: 0, duration: 0.8, ease: "power2.in" }, 9.2);
      tl.to("#bg", { opacity: 0, duration: 0.8, ease: "power2.in" }, 9.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
