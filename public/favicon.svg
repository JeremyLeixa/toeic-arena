<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#131833"/>
    </linearGradient>
    <linearGradient id="sword" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)" stroke="url(#sword)" stroke-width="8"/>
  <!-- Glow ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#glow)" stroke-width="24"/>
  <!-- Crossed swords -->
  <!-- Sword 1 (top-left to bottom-right) -->
  <g transform="rotate(-45 256 256)">
    <!-- Blade -->
    <rect x="240" y="80" width="32" height="240" rx="4" fill="url(#sword)"/>
    <!-- Guard -->
    <rect x="212" y="310" width="88" height="16" rx="8" fill="#ffd700"/>
    <!-- Grip -->
    <rect x="244" y="326" width="24" height="72" rx="4" fill="#8b6914"/>
    <!-- Pommel -->
    <circle cx="256" cy="410" r="18" fill="#ffd700"/>
  </g>
  <!-- Sword 2 (top-right to bottom-left) -->
  <g transform="rotate(45 256 256)">
    <!-- Blade -->
    <rect x="240" y="80" width="32" height="240" rx="4" fill="url(#sword)"/>
    <!-- Guard -->
    <rect x="212" y="310" width="88" height="16" rx="8" fill="#ffd700"/>
    <!-- Grip -->
    <rect x="244" y="326" width="24" height="72" rx="4" fill="#8b6914"/>
    <!-- Pommel -->
    <circle cx="256" cy="410" r="18" fill="#ffd700"/>
  </g>
  <!-- Center shield/emblem -->
  <circle cx="256" cy="256" r="52" fill="#0a0e1a" stroke="#ffd700" stroke-width="6"/>
  <text x="256" y="274" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#ffd700">T</text>
</svg>
