<!-- Stats -->
<section class="stats-section v3-stats" style="padding:56px 40px;border-top:1px solid var(--bdr);border-bottom:1px solid var(--bdr);position:relative">
  <div class="stats-grid">
    <div class="stat-card v3-reveal">
      <div class="v3-ico-tile"><svg class="ico"><use href="#i-feather"/></svg></div>
      <div class="v3-stat-n" data-count="2500">0+</div>
      <div class="v3-stat-l">Questions</div>
    </div>
    <div class="stat-card v3-reveal" style="transition-delay:.08s">
      <div class="v3-ico-tile"><svg class="ico"><use href="#i-grid"/></svg></div>
      <div class="v3-stat-n" data-count="25">0+</div>
      <div class="v3-stat-l">Modules</div>
    </div>
    <div class="stat-card v3-reveal" style="transition-delay:.16s">
      <div class="v3-ico-tile"><svg class="ico"><use href="#i-trophy"/></svg></div>
      <div class="v3-stat-n" data-count="58">0</div>
      <div class="v3-stat-l">Achievements</div>
    </div>
    <div class="stat-card v3-reveal" style="transition-delay:.24s">
      <div class="v3-ico-tile"><svg class="ico"><use href="#i-crown"/></svg></div>
      <div class="v3-stat-n" data-count="7">0</div>
      <div class="v3-stat-l">Leagues</div>
    </div>
  </div>
</section>
