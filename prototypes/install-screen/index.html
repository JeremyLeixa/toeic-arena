<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Proto — Écran Install (onboarding)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0f0c08;--bg2:#1a1610;--bg3:#28221a;
  --bg-rgb:15,12,8;--bg2-rgb:26,22,16;--bg3-rgb:40,34,26;
  --bdr:rgba(180,140,80,0.08);
  --gold:#f0c850;--green:#4abe60;--red:#e05252;
  --t1:#ede4d4;--t2:#8a7e6a;--t3:#756b54;
  --cx:212,148,58;--cx-hex:#d4943a;--cx-dark:#a06e20;--purple:#8b5e83;
}
.light{
  --bg:#f5f0e8;--bg2:#fffcf5;--bg3:#e8e0d2;
  --bg-rgb:245,240,232;--bg2-rgb:255,252,245;--bg3-rgb:232,224,210;
  --bdr:rgba(120,90,50,0.1);--gold:#a67c00;
  --t1:#1a1510;--t2:#5a5040;--t3:#6e6048;
  --cx:139,105,20;--cx-hex:#8b6914;--cx-dark:#6a4e10;--purple:#6b3d62;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:var(--t1);font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 12px;gap:18px}
.out{text-shadow:0 1px 2px rgba(0,0,0,.4)}
.light .out{text-shadow:none}

/* proto toolbar (not part of the real screen) */
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:#161616;border:1px solid #333;border-radius:12px;padding:10px 12px}
.bar b{color:#aaa;font-size:11px;align-self:center;margin-right:4px;text-transform:uppercase;letter-spacing:.05em}
.bar button{background:#222;color:#ccc;border:1px solid #444;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.bar button.on{background:var(--cx-hex);color:#0f0c08;border-color:var(--cx-hex)}

/* phone frame */
.phone{width:390px;max-width:100%;background:var(--bg);border-radius:34px;border:1px solid var(--bdr);box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden;position:relative}
.notch{height:26px;display:flex;align-items:center;justify-content:center}
.notch::after{content:"";width:90px;height:6px;border-radius:99px;background:rgba(var(--bg3-rgb),1)}

/* the actual screen */
.screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 22px 28px;min-height:600px;text-align:center}
.hero-ic{font-size:54px;line-height:1;margin:6px 0 12px;filter:drop-shadow(0 4px 10px rgba(var(--cx),.35))}
h2{font-family:'Cinzel',serif;font-weight:900;font-size:23px;color:var(--t1);line-height:1.2;margin-bottom:10px}
.bene{font-size:11.5px;color:var(--t3);margin-bottom:18px;letter-spacing:.01em}

/* device mock that highlights the key UI control */
.devmock{width:100%;max-width:310px;background:rgba(var(--bg2-rgb),1);border:1px solid var(--bdr);border-radius:16px;padding:14px;margin-bottom:18px}
.browserbar{display:flex;align-items:center;gap:8px;background:rgba(var(--bg3-rgb),.7);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--t2)}
.browserbar .url{flex:1;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ctrl{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;color:var(--t2)}
.ctrl.hl{color:var(--cx-hex);background:rgba(var(--cx),.14)}
.ctrl.hl::after{content:"";position:absolute;inset:-5px;border:2px solid var(--cx-hex);border-radius:11px;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(.92)}70%{opacity:0;transform:scale(1.15)}100%{opacity:0}}
.ctrl svg{width:18px;height:18px}
.callout{margin-top:10px;font-size:11px;color:var(--cx-hex);font-weight:700;display:flex;align-items:center;gap:6px;justify-content:center}

/* steps */
.steps{width:100%;display:flex;flex-direction:column;gap:9px;margin-bottom:20px;text-align:left}
.step{display:flex;gap:11px;align-items:center;background:rgba(var(--cx),.06);border:1px solid rgba(var(--cx),.15);border-radius:12px;padding:11px 13px}
.step .n{width:24px;height:24px;flex-shrink:0;border-radius:50%;background:var(--cx-hex);color:#0f0c08;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.light .step .n{color:#fff}
.step .tx{font-size:12.5px;color:var(--t1);line-height:1.45}
.step .tx i{color:var(--cx-hex);font-style:normal;font-weight:700}
.step .ic{font-size:16px;flex-shrink:0}

/* why card */
.why{width:100%;background:rgba(var(--bg3-rgb),.5);border:1px solid var(--bdr);border-radius:12px;padding:12px 14px;text-align:left;margin-bottom:18px}
.why .h{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.why .row{display:flex;gap:9px;align-items:center;margin-top:7px}
.why .row span:first-child{font-size:15px}
.why .row span:last-child{font-size:12px;color:var(--t2)}

.btn1{width:100%;border:none;border-radius:13px;padding:15px 28px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--cx-hex),var(--purple));box-shadow:0 6px 18px rgba(var(--cx),.3);margin-bottom:9px}
.btn2{width:100%;background:none;border:none;color:var(--t2);font-size:13px;font-weight:600;font-family:inherit;padding:11px;cursor:pointer}
.foot{color:var(--t3);font-size:10px;margin-top:11px;line-height:1.5;max-width:280px}

.tag{font-size:10px;color:#777;text-align:center}
</style>
</head>
<body class="">

<div class="bar">
  <b>OS</b>
  <button id="os-ios" class="on" onclick="setOS('ios')">iOS / Safari</button>
  <button id="os-and" onclick="setOS('and')">Android / Chrome</button>
  <button id="os-desk" onclick="setOS('desk')">Desktop</button>
  <b style="margin-left:8px">Thème</b>
  <button id="th-dark" class="on" onclick="setTheme('dark')">Dark</button>
  <button id="th-light" onclick="setTheme('light')">Light</button>
</div>

<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="hero-ic" id="hero"></div>
    <h2 class="out" id="ttl">Installe Verse Arena sur ton écran d'accueil</h2>

    <!-- device mock highlighting the control to tap -->
    <div class="devmock">
      <div class="browserbar">
        <span class="ctrl" id="c-left"></span>
        <span class="url">app.verse-arena.fr</span>
        <span class="ctrl" id="c-right"></span>
      </div>
      <div class="callout" id="callout"></div>
    </div>

    <div class="steps" id="steps"></div>

    <p class="bene">Plein écran · rappels de série · tes acquis te suivent</p>

    <button class="btn1" id="cta">C'est fait, continuer →</button>
    <button class="btn2">Plus tard</button>
  </div>
</div>

<div class="tag">Proto standalone — non déployé. Toggle OS/thème = outil de preview, pas dans l'écran réel.</div>

<script>
// inline SVG icons (share / kebab / plus)
var SVG={
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M8 8l4-4 4 4"/><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
  kebab:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 9v6M9 12h6"/></svg>'
};

// med-fan decorative icons (game-icons, viewBox 0 0 512 512) — drop straight into GAME_ICON_PATHS at port time
var GI={
  castle:"M254.25 15.344c-132.537 0-240.188 107.62-240.188 240.156c0 132.537 107.65 240.188 240.188 240.188S494.406 388.038 494.406 255.5S386.786 15.344 254.25 15.344m0 18.687c122.436 0 221.47 99.034 221.47 221.47c0 65.65-28.465 124.583-73.75 165.125V238.75l14-22.78h-7.595L364 101.5l-43.813 114.47h-8.156l14.595 22.78v33.875h-36.813v-88.188l14.625-22.78h-7.593l-44.406-114.47l-44.375 114.47h-7.594l14.03 22.78v123.22h-37.375v-18.094l14.594-22.782h-8.19l-43.78-114.467L95.344 266.78H87.75l14.03 22.783V416.25C59.25 375.9 32.75 318.83 32.75 255.5c0-122.436 99.064-221.47 221.5-221.47zm1.094 160.532h18.687v36.344h-18.686v-36.344zm110.156 87.97h18.688v36.312H365.5V282.53zm-246.656 22.03h18.687v36.344h-18.686v-36.344zm50.875 29.407h18.686v36.342H169.72V333.97zm170.81 30.5h18.69v36.342h-18.69z",
  compass:"m203.97 23l-18.032 4.844l11.656 43.468c-25.837 8.076-50.32 21.653-71.594 40.75L94.53 80.594l-13.218 13.22l31.376 31.374c-19.467 21.125-33.414 45.53-41.813 71.343l-42.313-11.343l-4.843 18.063l42.25 11.313c-6.057 27.3-6.157 55.656-.345 83L23.72 308.78l4.843 18.064l41.812-11.22a193.3 193.3 0 0 0 31.25 59.876l-29.97 52.688l-16.81 29.593l29.56-16.842l52.657-29.97a193.3 193.3 0 0 0 60.094 31.407l-11.22 41.844l18.033 4.81l11.218-41.905a195.7 195.7 0 0 0 83-.375l11.312 42.28l18.063-4.81l-11.344-42.376c25.812-8.4 50.217-22.315 71.342-41.78l31.375 31.373l13.22-13.218l-31.47-31.47a193.3 193.3 0 0 0 40.72-71.563l43.53 11.657l4.813-18.063l-43.625-11.686a195.7 195.7 0 0 0-.344-82.063l43.97-11.78l-4.813-18.063L440.908 197c-6.73-20.866-17.08-40.79-31.032-58.844l29.97-52.656l16.842-29.563l-29.593 16.844l-52.656 29.97c-17.998-13.875-37.874-24.198-58.657-30.906l11.783-44L309.5 23l-11.78 43.97c-27-5.925-55.02-6.05-82.064-.376zm201.56 85L297.25 298.313l-.75.437l-40.844-40.875l-148.72 148.72l-2.186 1.25l109.125-191.75l41.78 41.78L405.532 108zm-149.686 10.594c21.858 0 43.717 5.166 63.594 15.47l-116.625 66.342l-2.22 1.28l-1.28 2.22l-66.25 116.406c-26.942-52.04-18.616-117.603 25.03-161.25c26.99-26.988 62.38-40.468 97.75-40.468zm122.72 74.594c26.994 52.054 18.67 117.672-25.002 161.343c-43.66 43.662-109.263 52.005-161.312 25.033l116.438-66.282l2.25-1.25l1.25-2.25l66.375-116.592z",
  pointing:"M18.465 20.182v192.9c38.45 80.782 55.772 134.822 150.726 221.098l.167.15l.16.158c3.06 3.06 5.89 3.828 10.14 3.455c4.247-.373 9.65-2.494 14.738-5.912c9.313-6.256 16.457-17.503 17.67-22.266l-56.06-56.065l13.214-13.216l62.94 62.944c1.316 1.316 2.67 1.804 6.508 1.115s9.267-3.1 14.61-6.78c10.098-6.954 19.75-18.663 22.835-26.454l-56.02-56.02l13.216-13.216l63.667 63.67c19.495-3.225 35.412-16.64 41.65-32.52l.756.296l-71.514-71.516l13.214-13.215L447.81 415.52c7.58 7.58 14.7 9.95 21.032 9.853c6.33-.096 12.216-2.88 16.62-7.41c8.805-9.06 12.096-23.49-2.255-37.84L259.97 156.88l13.214-13.214l33.08 33.08c46.988-3.724 84.773-17.932 102.148-33.6c8.914-8.04 12.147-15.414 11.424-22.306c-.644-6.142-5.172-13.675-15.865-21.79c-52.33 22.22-109.035 19.23-162.685 2.538c-54.338-16.908-105.852-47.735-148.47-81.406h-74.35z",
  flag:"M151 32v247h18V32zm247 9.574l-13.428 7.59c-31.626 17.876-61.492 12.267-93.138 4.356c-31.647-7.912-64.83-18.84-97.946-4.807L188 51.039v115.549l12.512-5.3c25.883-10.968 54.201-2.396 86.554 5.692s68.988 14.98 106.362-6.144l4.572-2.584zM73 297v67.271l32 32V487h302v-90.729l32-32V297h-46v39h-18v-39h-46v39h-18v-39h-46v39h-18v-39h-46v39h-18v-39h-46v39h-18v-39z"
};
function gi(name,size,color){return '<svg viewBox="0 0 512 512" width="'+size+'" height="'+size+'" style="display:inline-block;vertical-align:middle"><path fill="'+(color||'currentColor')+'" d="'+GI[name]+'"/></svg>';}

var DATA={
  ios:{
    sub:'Sur iPhone, les notifications et le plein écran ne marchent <b>que</b> si l\'app est sur ton écran d\'accueil. 10 secondes, et c\'est réglé.',
    side:'right', icon:'share',
    callout:'Touche ce bouton dans Safari',
    steps:[
      {n:1,ic:'compass',tx:'Ouvre cette page dans <i>Safari</i> (pas dans une autre app)'},
      {n:2,ic:'pointing',tx:'Touche le bouton <i>Partager</i> en bas de l\'écran'},
      {n:3,ic:'flag',tx:'Choisis <i>« Sur l\'écran d\'accueil »</i> puis Ajouter'}
    ]
  },
  and:{
    sub:'Ajoute Verse Arena à ton écran d\'accueil pour un lancement plein écran et les rappels de série. 10 secondes.',
    side:'right', icon:'kebab',
    callout:'Touche le menu de Chrome',
    steps:[
      {n:1,ic:'pointing',tx:'Touche le menu <i>⋮</i> en haut à droite de Chrome'},
      {n:2,ic:'flag',tx:'Choisis <i>« Installer l\'application »</i> (ou « Ajouter à l\'écran d\'accueil »)'},
      {n:3,ic:'castle',tx:'Confirme — l\'icône apparaît avec tes autres apps'}
    ]
  },
  desk:{
    sub:'Installe Verse Arena en un clic pour la lancer comme une vraie app, sans onglet de navigateur.',
    side:'right', icon:'plus',
    callout:'Clique l\'icône d\'installation dans la barre d\'adresse',
    steps:[
      {n:1,ic:'compass',tx:'Repère l\'icône <i>Installer</i> à droite de la barre d\'adresse'},
      {n:2,ic:'pointing',tx:'Clique dessus puis <i>« Installer »</i>'},
      {n:3,ic:'castle',tx:'Verse Arena s\'ouvre dans sa propre fenêtre'}
    ]
  }
};

function render(os){
  var d=DATA[os];
  document.getElementById('hero').innerHTML=gi('castle',58,'var(--cx-hex)');
  document.getElementById('callout').innerHTML=gi('pointing',13,'currentColor')+' '+d.callout;
  // controls in browser bar
  document.getElementById('c-left').className='ctrl';
  document.getElementById('c-left').innerHTML=os==='ios'?'':SVG.kebab;
  var right=document.getElementById('c-right');
  right.className='ctrl hl';
  right.innerHTML=SVG[d.icon];
  // steps
  document.getElementById('steps').innerHTML=d.steps.map(function(s){
    return '<div class="step"><span class="n">'+s.n+'</span><span class="tx">'+s.tx+'</span><span class="ic">'+gi(s.ic,17,'var(--cx-hex)')+'</span></div>';
  }).join('');
}
function setOS(os){
  ['ios','and','desk'].forEach(function(k){document.getElementById('os-'+(k==='and'?'and':k==='desk'?'desk':'ios')).classList.remove('on');});
  document.getElementById('os-'+(os==='and'?'and':os==='desk'?'desk':'ios')).classList.add('on');
  render(os);
}
function setTheme(t){
  document.body.className=t==='light'?'light':'';
  document.getElementById('th-dark').classList.toggle('on',t!=='light');
  document.getElementById('th-light').classList.toggle('on',t==='light');
}
render('ios');
</script>
</body>
</html>
