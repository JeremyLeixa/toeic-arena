<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chest Animation — Boss Loot V2 (SVG wooden chest)</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #1a0a00 0%, #080402 100%);
    color: #ede4d4;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    overflow-y: auto;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.6) 80%);
    pointer-events: none;
    z-index: 1;
  }
  .controls {
    display: flex; gap: 8px; margin: 20px 0 10px; flex-wrap: wrap;
    justify-content: center; z-index: 20; position: relative;
  }
  .controls button {
    padding: 6px 14px; border-radius: 99px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.4); color: #ede4d4;
    font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer;
  }
  .controls button.active { background: rgba(212,148,58,0.2); border-color: #d4943a; color: #d4943a; }
  .title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 22px; margin: 24px 0 6px; letter-spacing: 2px; color: #d4943a; text-align: center; z-index: 20; position: relative; }
  .subtitle { font-size: 12px; color: #8a7e6a; margin-bottom: 20px; letter-spacing: 1px; text-transform: uppercase; z-index: 20; position: relative; }

  .stage {
    position: relative;
    width: 360px;
    height: 560px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    overflow: hidden;
  }

  /* ── Screen flash ── */
  .flash-white {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    animation: screenFlash 0.4s ease-out 2.0s;
    z-index: 10;
    pointer-events: none;
  }

  /* ── Chest container (holds lid + body) ── */
  .chest-wrap {
    position: absolute;
    width: 180px;
    height: 150px;
    opacity: 0;
    transform: scale(0.3);
    animation: chestZoom 0.6s cubic-bezier(.2,.8,.4,1.3) 0.2s forwards,
               chestTrembor 0.5s ease-in-out 1.0s 2;
    filter: drop-shadow(0 12px 20px rgba(0,0,0,0.8));
    z-index: 3;
  }
  .chest-wrap svg { width: 100%; height: 100%; overflow: visible; }

  /* ── Chest lid (top half) — flies up on explode ── */
  .chest-lid {
    transform-origin: 50% 100%;
    animation: lidFly 0.6s ease-out 2.0s forwards;
  }

  /* ── Chest body (bottom half) — collapses on explode ── */
  .chest-body {
    transform-origin: 50% 50%;
    animation: bodyCollapse 0.5s ease-in 2.1s forwards;
  }

  /* ── Explosion burst at impact ── */
  .burst {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, white 0%, var(--rarity, #ffc020) 30%, transparent 70%);
    opacity: 0;
    animation: burstExpand 0.6s ease-out 2.0s forwards;
    z-index: 4;
  }

  /* ── Wood shards (brown) ── */
  .wood-shard {
    position: absolute;
    width: 10px; height: 16px;
    background: linear-gradient(180deg, #6b3f1a, #4a2a10);
    top: 50%; left: 50%;
    border-radius: 2px;
    opacity: 0;
    box-shadow: inset 0 -2px 3px rgba(0,0,0,0.5);
    animation: shardFly 0.9s ease-out 2.1s forwards;
    z-index: 6;
  }

  /* ── Metal shards (bronze) ── */
  .metal-shard {
    position: absolute;
    width: 6px; height: 10px;
    background: linear-gradient(180deg, #8b6a30, #5a4418);
    top: 50%; left: 50%;
    border-radius: 1px;
    opacity: 0;
    box-shadow: 0 0 4px rgba(212,148,58,0.6);
    animation: shardFly 0.9s ease-out 2.2s forwards;
    z-index: 6;
  }

  /* ── Magic shards (rarity-colored, upward bias) ── */
  .magic-shard {
    position: absolute;
    width: 5px; height: 12px;
    background: var(--rarity, #ffc020);
    top: 50%; left: 50%;
    border-radius: 2px;
    opacity: 0;
    filter: drop-shadow(0 0 6px var(--rarity, #ffc020));
    animation: shardFly 1.0s ease-out 2.2s forwards;
    z-index: 6;
  }

  /* ── Dust cloud (grey, expands then fades) ── */
  .dust {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(120,90,60,0.4), transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    animation: dustExpand 1.0s ease-out 2.1s forwards;
    z-index: 2;
    filter: blur(3px);
  }

  /* ── Vertical light beam (phase 3) ── */
  .beam-mega {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 80px;
    height: 0;
    background: linear-gradient(to top,
      transparent 0%,
      var(--rarity, #ffc020) 30%,
      rgba(255,255,255,0.9) 70%,
      transparent 100%);
    transform: translate(-50%, -50%);
    opacity: 0;
    animation: beamGrow 0.5s ease-out 2.2s forwards,
               beamShrink 0.5s ease-in 4.2s forwards;
    z-index: 2;
    filter: blur(1px);
    pointer-events: none;
  }
  .beam-mega::before {
    content: '';
    position: absolute;
    inset: 0;
    background: inherit;
    filter: blur(12px);
    opacity: 0.5;
  }
  .beam-mega::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--rarity, #ffc020) 0%, transparent 60%);
    opacity: 0.6;
    filter: blur(20px);
  }

  /* ── Reward descending ── */
  .reward-card {
    position: absolute;
    width: 200px;
    padding: 22px 18px;
    border-radius: 14px;
    background: linear-gradient(180deg, #2a1e14 0%, #1a1208 100%);
    border: 2px solid var(--rarity, #ffc020);
    box-shadow:
      0 0 60px var(--rarity, #ffc020),
      0 0 120px var(--rarity-soft, rgba(255,192,32,0.4)),
      inset 0 0 30px rgba(0,0,0,0.6);
    text-align: center;
    opacity: 0;
    transform: translateY(-220px) scale(0.6) rotate(-8deg);
    animation: rewardFall 0.8s cubic-bezier(.3,.1,.4,1.4) 2.6s forwards,
               rewardSettle 0.4s ease-out 3.4s forwards;
    z-index: 5;
  }
  .reward-rarity {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 900;
    color: var(--rarity, #ffc020);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
    padding: 4px 10px;
    display: inline-block;
    border: 1px solid var(--rarity, #ffc020);
    border-radius: 4px;
  }
  .reward-icon {
    font-size: 72px;
    margin: 10px 0;
    filter: drop-shadow(0 0 18px var(--rarity, #ffc020));
    animation: iconFloat 2s ease-in-out infinite;
    animation-delay: 3.5s;
  }
  .reward-name {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 900;
    color: #ede4d4;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .reward-sub { font-size: 11px; color: #8a7e6a; letter-spacing: 1px; }

  /* ── Ground impact ring when reward lands ── */
  .impact-ring {
    position: absolute;
    top: 65%;
    left: 50%;
    width: 200px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--rarity, #ffc020);
    transform: translate(-50%, -50%) scaleY(0.4);
    opacity: 0;
    animation: impactRing 0.8s ease-out 3.4s forwards;
    filter: blur(1px);
  }

  /* ── Speed lines during fall ── */
  .speed-line {
    position: absolute;
    width: 2px;
    height: 80px;
    background: linear-gradient(to bottom, transparent, var(--rarity, #ffc020), transparent);
    opacity: 0;
    animation: speedLineFall 0.8s ease-out 2.6s;
  }

  /* ── Replay ── */
  .replay {
    margin: 30px 0 40px;
    padding: 12px 28px;
    background: linear-gradient(135deg, #dc2626, #d4943a);
    border: none; border-radius: 10px;
    color: #0f0c08;
    font-family: 'Cinzel', serif;
    font-weight: 800; font-size: 14px;
    cursor: pointer; letter-spacing: 1px;
    position: relative; z-index: 20;
  }
  .replay:active { transform: scale(0.96); }

  /* Keyframes */
  @keyframes chestZoom {
    0% { opacity: 0; transform: scale(0.3); }
    60% { transform: scale(1.15); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes chestTrembor {
    0%, 100% { transform: translate(0,0) rotate(0); }
    25% { transform: translate(-5px,-3px) rotate(-4deg); }
    75% { transform: translate(5px,-3px) rotate(4deg); }
  }
  @keyframes lidFly {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    40%  { transform: translateY(-80px) rotate(-30deg); opacity: 1; }
    100% { transform: translateY(-200px) rotate(-80deg); opacity: 0; }
  }
  @keyframes bodyCollapse {
    0%   { transform: scale(1,1) translateY(0); opacity: 1; filter: brightness(1); }
    40%  { transform: scale(1.1,0.85) translateY(8px); filter: brightness(2); }
    100% { transform: scale(0.4,0.2) translateY(30px); opacity: 0; filter: brightness(4); }
  }
  @keyframes screenFlash {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.85; }
  }
  @keyframes burstExpand {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(80); }
  }
  @keyframes dustExpand {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0); }
    30%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(3.5); }
  }
  @keyframes shardFly {
    0% { opacity: 1; transform: translate(-50%,-50%) rotate(var(--angle,0deg)) translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%,-50%) rotate(var(--angle,0deg)) translateY(var(--dist,200px)) rotate(720deg); }
  }
  @keyframes beamGrow {
    0% { height: 0; opacity: 0.4; }
    100% { height: 800px; opacity: 1; }
  }
  @keyframes beamShrink {
    to { opacity: 0; }
  }
  @keyframes rewardFall {
    0% { opacity: 0; transform: translateY(-220px) scale(0.6) rotate(-8deg); }
    30% { opacity: 1; }
    100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes rewardSettle {
    0% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-10px) scale(1.05); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes impactRing {
    0% { opacity: 1; transform: translate(-50%,-50%) scaleY(0.4) scaleX(0.3); }
    100% { opacity: 0; transform: translate(-50%,-50%) scaleY(0.4) scaleX(2.5); }
  }
  @keyframes speedLineFall {
    0% { opacity: 0; transform: translateY(-100px); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translateY(200px); }
  }
  @keyframes iconFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
</style>
</head>
<body>

<div class="title">Boss Loot · V2</div>
<div class="subtitle">Wooden treasure chest with golden lock</div>

<div class="controls">
  <button data-rarity="common" data-color="#909090" data-soft="rgba(144,144,144,0.3)">Common</button>
  <button data-rarity="uncommon" data-color="#3ecc78" data-soft="rgba(62,204,120,0.3)">Uncommon</button>
  <button data-rarity="rare" data-color="#3a8ee0" data-soft="rgba(58,142,224,0.3)">Rare</button>
  <button data-rarity="epic" data-color="#c060f0" data-soft="rgba(192,96,240,0.3)">Epic</button>
  <button data-rarity="legendary" data-color="#ffc020" data-soft="rgba(255,192,32,0.4)" class="active">Legendary</button>
</div>

<div id="stage" class="stage" style="--rarity: #ffc020; --rarity-soft: rgba(255,192,32,0.4)"></div>

<button id="replay" class="replay">Replay Animation</button>

<!-- SVG treasure chest template (hidden, cloned into the stage) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Wood gradients: lit top, darker bottom for depth -->
    <linearGradient id="woodLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="60%" stop-color="#6b3f1a"/>
      <stop offset="100%" stop-color="#4a2a10"/>
    </linearGradient>
    <linearGradient id="woodBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b3f1a"/>
      <stop offset="100%" stop-color="#3a1f0a"/>
    </linearGradient>
    <!-- Metal bands -->
    <linearGradient id="metalBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a4e20"/>
      <stop offset="50%" stop-color="#4a3614"/>
      <stop offset="100%" stop-color="#2e2008"/>
    </linearGradient>
    <!-- Gold lock -->
    <linearGradient id="goldLock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c850"/>
      <stop offset="50%" stop-color="#d4943a"/>
      <stop offset="100%" stop-color="#8b5e20"/>
    </linearGradient>
    <!-- Inner shadow for depth under the lid -->
    <linearGradient id="innerShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0f05"/>
      <stop offset="100%" stop-color="#2a1a08"/>
    </linearGradient>
  </defs>
</svg>

<template id="chestTemplate">
  <svg viewBox="0 0 180 150">
    <!-- Body (bottom half) -->
    <g class="chest-body">
      <!-- Main body rect -->
      <rect x="10" y="65" width="160" height="80" rx="3" fill="url(#woodBody)" stroke="#2a1509" stroke-width="1.5"/>
      <!-- Vertical planks -->
      <line x1="50" y1="68" x2="50" y2="142" stroke="#2a1509" stroke-width="1" opacity="0.7"/>
      <line x1="90" y1="68" x2="90" y2="142" stroke="#2a1509" stroke-width="1" opacity="0.7"/>
      <line x1="130" y1="68" x2="130" y2="142" stroke="#2a1509" stroke-width="1" opacity="0.7"/>
      <!-- Metal band top (right under the lid) -->
      <rect x="8" y="63" width="164" height="6" fill="url(#metalBand)" stroke="#1a1005" stroke-width="0.5"/>
      <!-- Metal band middle -->
      <rect x="8" y="100" width="164" height="4" fill="url(#metalBand)" stroke="#1a1005" stroke-width="0.5"/>
      <!-- Metal band bottom -->
      <rect x="8" y="138" width="164" height="5" fill="url(#metalBand)" stroke="#1a1005" stroke-width="0.5"/>
      <!-- Corner rivets -->
      <circle cx="14" cy="66" r="1.8" fill="#8b6a30"/>
      <circle cx="166" cy="66" r="1.8" fill="#8b6a30"/>
      <circle cx="14" cy="141" r="1.8" fill="#8b6a30"/>
      <circle cx="166" cy="141" r="1.8" fill="#8b6a30"/>
      <!-- Foot brackets -->
      <rect x="12" y="138" width="18" height="8" rx="1" fill="url(#metalBand)"/>
      <rect x="150" y="138" width="18" height="8" rx="1" fill="url(#metalBand)"/>
      <!-- Gold lock -->
      <rect x="78" y="78" width="24" height="22" rx="2" fill="url(#goldLock)" stroke="#5a3c10" stroke-width="1"/>
      <!-- Keyhole: circle + triangle -->
      <circle cx="90" cy="86" r="3" fill="#1a1005"/>
      <path d="M 88.5 86 L 91.5 86 L 91 94 L 89 94 Z" fill="#1a1005"/>
      <!-- Lock highlight -->
      <rect x="80" y="79" width="20" height="3" rx="1" fill="rgba(255,240,180,0.5)"/>
    </g>

    <!-- Lid (top half) -->
    <g class="chest-lid">
      <!-- Curved lid top -->
      <path d="M 10 65 Q 10 15 90 15 Q 170 15 170 65 Z" fill="url(#woodLid)" stroke="#2a1509" stroke-width="1.5"/>
      <!-- Lid inner arc for depth -->
      <path d="M 10 65 Q 10 15 90 15 Q 170 15 170 65" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
      <!-- Lid vertical planks (radial from center) -->
      <path d="M 50 65 Q 55 25 65 20" fill="none" stroke="#2a1509" stroke-width="1" opacity="0.6"/>
      <path d="M 90 65 L 90 15" stroke="#2a1509" stroke-width="1" opacity="0.6"/>
      <path d="M 130 65 Q 125 25 115 20" fill="none" stroke="#2a1509" stroke-width="1" opacity="0.6"/>
      <!-- Metal band around the lid edge (gives 3D volume) -->
      <path d="M 10 65 Q 10 15 90 15 Q 170 15 170 65" fill="none" stroke="url(#metalBand)" stroke-width="5"/>
      <!-- Central vertical metal strip on lid -->
      <rect x="87" y="16" width="6" height="49" fill="url(#metalBand)"/>
      <!-- Top rivet -->
      <circle cx="90" cy="19" r="2" fill="#d4943a" stroke="#5a3c10" stroke-width="0.5"/>
      <!-- Lock tongue (hanging from lid) -->
      <rect x="85" y="60" width="10" height="10" fill="url(#goldLock)" stroke="#5a3c10" stroke-width="1"/>
    </g>
  </svg>
</template>

<script>
  const stage = document.getElementById('stage');
  const replayBtn = document.getElementById('replay');
  const buttons = document.querySelectorAll('.controls button');
  const chestTpl = document.getElementById('chestTemplate');

  const rarityData = {
    common:    { color: '#909090', soft: 'rgba(144,144,144,0.3)', label: 'Common',    icon: '🎁', name: 'Peasant',  sub: 'Common Avatar' },
    uncommon:  { color: '#3ecc78', soft: 'rgba(62,204,120,0.3)',  label: 'Uncommon',  icon: '🛡️', name: 'Knight',   sub: 'Uncommon Avatar' },
    rare:      { color: '#3a8ee0', soft: 'rgba(58,142,224,0.3)',  label: 'Rare',      icon: '💙', name: 'Sapphire', sub: 'Rare Skin' },
    epic:      { color: '#c060f0', soft: 'rgba(192,96,240,0.3)',  label: 'Epic',      icon: '🔮', name: 'Amethyst', sub: 'Epic Skin' },
    legendary: { color: '#ffc020', soft: 'rgba(255,192,32,0.4)',  label: 'Legendary', icon: '💎', name: 'Aurora Borealis', sub: 'Legendary Skin' }
  };
  let current = rarityData.legendary;

  function buildScene() {
    stage.innerHTML = '';
    stage.style.setProperty('--rarity', current.color);
    stage.style.setProperty('--rarity-soft', current.soft);

    // Chest (cloned from template)
    const chestWrap = document.createElement('div');
    chestWrap.className = 'chest-wrap';
    chestWrap.appendChild(chestTpl.content.cloneNode(true));
    stage.appendChild(chestWrap);

    // Dust cloud
    const dust = document.createElement('div');
    dust.className = 'dust';
    stage.appendChild(dust);

    // Explosion burst
    const burst = document.createElement('div');
    burst.className = 'burst';
    stage.appendChild(burst);

    // Wood shards (8 — radiating outward)
    for (let i = 0; i < 8; i++) {
      const shard = document.createElement('div');
      shard.className = 'wood-shard';
      const angle = (i / 8) * 360 + 22;
      const dist = 120 + Math.random() * 60;
      shard.style.setProperty('--angle', angle + 'deg');
      shard.style.setProperty('--dist', dist + 'px');
      stage.appendChild(shard);
    }

    // Metal shards (5 — scattered)
    for (let i = 0; i < 5; i++) {
      const shard = document.createElement('div');
      shard.className = 'metal-shard';
      const angle = (i / 5) * 360 + 45;
      const dist = 100 + Math.random() * 80;
      shard.style.setProperty('--angle', angle + 'deg');
      shard.style.setProperty('--dist', dist + 'px');
      stage.appendChild(shard);
    }

    // Magic shards (6 — biased upward)
    for (let i = 0; i < 6; i++) {
      const shard = document.createElement('div');
      shard.className = 'magic-shard';
      const angle = -70 + (i / 5) * 140; // -70° to +70° (upward arc)
      const dist = 150 + Math.random() * 80;
      shard.style.setProperty('--angle', angle + 'deg');
      shard.style.setProperty('--dist', dist + 'px');
      stage.appendChild(shard);
    }

    // Screen flash
    const flash = document.createElement('div');
    flash.className = 'flash-white';
    stage.appendChild(flash);

    // Beam
    const beam = document.createElement('div');
    beam.className = 'beam-mega';
    stage.appendChild(beam);

    // Speed lines during fall
    for (let i = 0; i < 6; i++) {
      const sl = document.createElement('div');
      sl.className = 'speed-line';
      sl.style.left = (20 + i * 12) + '%';
      sl.style.top = '15%';
      sl.style.animationDelay = (2.6 + Math.random() * 0.3) + 's';
      stage.appendChild(sl);
    }

    // Impact ring
    const ring = document.createElement('div');
    ring.className = 'impact-ring';
    stage.appendChild(ring);

    // Reward card (falls from top)
    const reward = document.createElement('div');
    reward.className = 'reward-card';
    reward.innerHTML = `
      <div class="reward-rarity">${current.label}</div>
      <div class="reward-icon">${current.icon}</div>
      <div class="reward-name">${current.name}</div>
      <div class="reward-sub">${current.sub}</div>
    `;
    stage.appendChild(reward);
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      current = rarityData[btn.dataset.rarity];
      buildScene();
    });
  });
  replayBtn.addEventListener('click', buildScene);
  buildScene();
</script>
</body>
</html>
